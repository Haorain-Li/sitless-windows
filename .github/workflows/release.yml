name: Publish tagged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Build and run all checks
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $manifest = [xml](Get-Content -LiteralPath app.manifest -Raw)
          $version = ([version]$manifest.assembly.assemblyIdentity.version).ToString(3)
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and application version differ' }
          ./package.ps1

      - name: Verify tagged portable files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('SitLess.exe', "SitLess-Windows-$env:RELEASE_TAG.zip")
          $lines = @(Get-Content -LiteralPath portable/SHA256SUMS.txt)
          if ($lines.Count -ne $names.Count) { throw 'Unexpected checksum manifest' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum entry' }
            $expected = $Matches[1]
            $name = $Matches[2]
            if ($name -notin $names) { throw 'Unexpected portable file' }
            $actual = (Get-FileHash -LiteralPath (Join-Path portable $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch: $name" }
          }
          $version = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path portable/SitLess.exe)).Version.ToString(3)
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Portable program version differs' }

      - name: Publish release and verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @('portable/SitLess.exe', "portable/SitLess-Windows-$env:RELEASE_TAG.zip", 'portable/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "起身 · Sit Less $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view $env:RELEASE_TAG --json url,publishedAt
